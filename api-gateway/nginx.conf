events { 
    worker_connections 1024; 
}

http {
    upstream job_auth {
        server job-auth-service:8001;
    }
    upstream ats_engine {
        server ats-screening-service:8002;
    }
    upstream assessment_engine {
        server assessment-service:8003;
    }
    upstream ai_interviewer {
        server ai-interview-service:8004;
    }
    upstream web_client {
        server web-frontend:3000;
    }

    server {
        listen 80;

        # Web Application Frontend
        location / {
            proxy_pass http://web_client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auth & Job Management API
        location /api/v1/jobs {
            proxy_pass http://job_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/auth {
            proxy_pass http://job_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ATS Resume Screening API
        location /api/v1/ats {
            client_max_body_size 15M; # Permit PDF uploads
            proxy_pass http://ats_engine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Assessment & Exam API
        location /api/v1/assessments {
            proxy_pass http://assessment_engine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # AI Interview Bi-directional WebSockets
        location /api/v1/interviews {
            proxy_pass http://ai_interviewer;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }
}